[project]
name = "datamask"
version = "0.1.0"
description = "Локальное маскирование персональных данных в XLSX/CSV"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.5.2",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "faker>=40.54.0",
    "fastapi",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn",
]

[project.scripts]
datamask = "datamask.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "ruff",
    "mypy",
    "httpx2>=2.16.0",
    "types-openpyxl>=3.1.5.20261017",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261113",
    "hypothesis>=6.170.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/datamask"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1 -m \"not slow\""
markers = ["slow: долгие бенчмарки, не в каждом прогоне"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
files = ["backend/datamask"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["datamask.core.*"]
strict = true

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S603", "S311", "S105", "S106"]  # процессы, random и пароли в тестах
"scripts/*" = ["S311"]  # детерминированные синтетические данные, не криптография
