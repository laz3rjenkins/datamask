[project]
name = "datamask"
version = "0.1.0"
description = "Локальное маскирование персональных данных в XLSX/CSV"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
datamask = "datamask.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "ruff",
    "mypy",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/datamask"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1"
markers = ["slow: долгие бенчмарки, не в каждом прогоне"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
files = ["backend/datamask"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["datamask.core.*"]
strict = true

[tool.ruff.format]
exclude = ["*.md"]
