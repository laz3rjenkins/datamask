# Словари для распознавания. Дополняйте свободно: регистр, ё/е и знаки препинания не важны.
#   headers — ключевые слова в заголовке колонки. Слово из 3+ букв совпадает с началом
#             слова заголовка («тел» → «Телефон»), короче — только целиком («д р» → «Д.р.»).
#   context — для слабых типов в свободном тексте: слово в пределах keyword_window символов
#             слева от находки («паспорт 4506 123456»).

thresholds:
  sample_size: 200              # сколько непустых значений колонки смотреть
  match_value_min: 0.5          # значение считается «похожим» на тип с этой уверенности
  strong_value_share: 0.8       # сильный тип без заголовка
  strong_with_header_share: 0.3 # сильный тип при совпавшем заголовке
  weak_with_header_share: 0.5   # слабый тип (только при совпавшем заголовке)
  free_text_min_avg_len: 30     # «Свободный текст»: средняя длина значения больше
  keyword_window: 30

entities:
  PERSON:
    headers: [фио, фамилия, имя, отчество, клиент, сотрудник, ответственный, менеджер,
              исполнитель, контактное лицо, покупатель, получатель, пациент, работник,
              руководитель, директор, name, full name, employee, customer, client, manager,
              contact person]
  PHONE:
    headers: [тел, телефон, моб, мобильный, сотовый, контактный номер, номер телефона,
              phone, mobile, tel, cell]
  EMAIL:
    headers: [email, e mail, почта, эл почта, электронная почта, емейл, mail]
  ADDRESS:
    headers: [адрес, место жительства, прописка, местонахождение, address]
  BIRTH_DATE:
    headers: [дата рождения, д р, др, день рождения, рожд, birth, birthday, date of birth, dob]
    context: [д.р., д. р., дата рождения, родил, г.р., рожд]
  PASSPORT:
    headers: [паспорт, серия и номер, passport]
    context: [паспорт, серия]
  SNILS:
    headers: [снилс, snils]
  INN_PERSON:
    headers: [инн, inn]
  IP:
    headers: [ip, ip адрес, ip address]
  CARD:
    headers: [карта, карты, номер карты, card, pan]
  ACCOUNT:
    headers: [расчетный, счет, р с, account, iban]
    context: [р/с, р/сч, расчетный, счет, сч.]
  ORG:
    headers: [организация, контрагент, компания, юрлицо, юр лицо, поставщик, заказчик,
              company, organization, organisation, vendor]
    context: []  # шаблон сам содержит ООО/АО/ИП: отдельное ключевое слово не нужно
  INN_ORG:
    headers: [инн, inn]
  OGRN:
    headers: [огрн, огрнип, ogrn]
  AMOUNT:
    headers: [сумма, выручка, стоимость, цена, оплата, доход, расход, зарплата, оклад, итого,
              руб, amount, revenue, price, total, sum]
